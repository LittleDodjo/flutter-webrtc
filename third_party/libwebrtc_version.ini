# libwebrtc prebuilt binary release info.
# Squeak: свой прибилд с аппаратным H.264 (NVENC) на отправке. Сборка —
# workflow `webrtc-builds.yml` в LittleDodjo/libwebrtc, ветка `squeak-nvenc`.
# Апстрим: https://github.com/webrtc-sdk/libwebrtc/releases
#
# Аппаратный декод (MediaFoundation/DXVA, сборка -nvenc.2) ОТКАЧЕН: он читает
# выходной сэмпл как плотно упакованный, игнорируя stride и crop-апертуру. У
# H.264 поверхность всегда выровнена по 16 (1920x1080 -> 1088, 760x488 ->
# 768x496), поэтому лишние строки паддинга лезли в кадр зелёной полосой, а на
# невыровненной по обеим осям картинке всё расчёсывалось по диагонали. Чтение
# и запись за границу буфера роняли и саму отрисовку Flutter — после
# отключения демонстрации приложение приходилось перезапускать.
#
# Ускорения он всё равно не давал: на приёме 1080p декодировалось в 8 fps и
# выбрасывалось кадров больше, чем декодировалось (decoded=21 dropped=36).
# Вернуть можно после того, как декодер начнёт брать stride из
# IMF2DBuffer2::Lock2DSize и обрезать по MF_MT_MINIMUM_DISPLAY_APERTURE.
[libwebrtc]
binary_version = libwebrtc.m144.7559.09-nvenc.1
download_url   = https://github.com/LittleDodjo/libwebrtc/releases/download
