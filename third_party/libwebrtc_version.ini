# libwebrtc prebuilt binary release info.
# Squeak: свой прибилд с аппаратным H.264 на Windows в обе стороны. Сборка —
# workflow `webrtc-builds.yml` в LittleDodjo/libwebrtc, ветка `squeak-nvenc`.
# Апстрим: https://github.com/webrtc-sdk/libwebrtc/releases
#
# Кодирование: NVENC → MediaFoundation → OpenH264. Средним звеном закрыты AMD и
# Intel: MediaFoundation сам выбирает железо, отдельные AMF и QSV не нужны.
#
# Захват экрана: свой путь через Desktop Duplication + ID3D11VideoProcessor,
# кадр конвертируется в NV12 на видеокарте. Штатный путь webrtc остался для
# окон, не-Windows и как откат.
#
# Декод: MediaFoundation. В сборке -nvenc.2 он был откачен — читал выходной
# сэмпл как плотно упакованный, игнорируя stride и crop-апертуру. У H.264
# поверхность всегда выровнена по 16 (1920x1080 -> 1088, 760x488 -> 768x496),
# поэтому паддинг лез в кадр зелёной полосой, а запись за границу буфера роняла
# отрисовку всего приложения. Начиная с -nvenc.3 геометрия берётся из
# MF_MT_FRAME_SIZE, обрезка из MF_MT_MINIMUM_DISPLAY_APERTURE, шаг строки из
# IMF2DBuffer2::Lock2DSize или MF_MT_DEFAULT_STRIDE.
# Захват экрана с -nvenc.5 умеет масштабировать кадр на видеокарте: габарит
# приходит из SetOutputSize (плагин берёт его из constraints width/height), и
# VideoProcessorBlt вписывает кадр ДО обратного чтения. 1080p с 4K-экрана стоит
# 186 МБ/с вместо 746. Там же убраны аллокация буфера на каждый кадр, создание
# входного представления на каждый кадр и синхронный Map сразу за блитом.
#
# Звук: custom-источник (loopback демонстрации) больше не перенастраивает общий
# APM движка — раньше он гасил эхоподавитель и шумодав заодно микрофону.
#
# С -nvenc.6 источник захвата объявляет is_screencast() = true. До этого webrtc
# кодировал рабочий стол как видео с камеры: работал quality scaler, сам
# понижавший разрешение по QP, рейт-контроль был рассчитан на движущуюся сцену,
# и не применялся screencast_min_bitrate.

[libwebrtc]
binary_version = libwebrtc.m144.7559.09-nvenc.6
download_url   = https://github.com/LittleDodjo/libwebrtc/releases/download
